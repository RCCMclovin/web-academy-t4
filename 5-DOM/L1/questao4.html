<style>
  h1 {
    width: 350px;
    padding: 20px;
    background-color: lightblue;
  }
  .lista {
    border: 1px solid lightcoral;
  }
</style>

<body>
  <h1>Questao 03</h1>

  <h3 id="lista-titulo">Lista de itens:</h3>

  <ul id="lista-itens">
    <li id="one" class="hot">item a</li>
    <li id="two" class="hot">item b</li>
    <li id="three" class="hot">item c</li>
    <li id="four">item d</li>
  </ul>
</body>
<script type="text/javascript">
  var h1 = document.querySelector("h1");
  h1.style.backgroundColor = "purple";
  console.log(h1);

  var h3 = document.querySelector("h3");
  h3.classList.add("lista");
  console.log(h3)

  var list = document.querySelector("#lista-itens").getElementsByClassName("hot");
  for (let i = 0; i < list.length; i++){
    list[i].style.fontWeight="bold";
    console.log(list[i]);
  }
</script>
