<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        div.blue{width:100px;height:200px;background-color: blue;}
        div.yellow{left:108px;width:100px;height:150px;background-color: yellow;}
        div.red{left:200px;width:100px;height:150px;background-color: red;}
        div.green{left:100px;width:200px;height:50px;background-color: green;}
    </style>

    <div class="blue" style="position:absolute;"></div>
    <div class="yellow" style="position:fixed;"></div>
    <div class="red" style="position:relative;"></div>
    <div class="green" style="position:relative;"></div>
    
</body>
</html>
