    <div>
        <h2>Nebulosa</h2>
        <p>
            Una nebulosa es una nube gigante de polvo y gas en el espacio. 
            Algunas nebulosas provienen del gas y el polvo expulsado por la explosión 
            de una estrella moribunda, como una supernova . Otras nebulosas son regiones 
            donde comienzan a formarse nuevas estrellas.
        </p>
