<!DOCTYPE html>
<head>
    <meta charset="UTF8">
    <meta name="author" content="Rafael Catilho">
    <title>Gráfico</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>Um Gráfico de Barras</h1>
    <form id="form">
        <label for="b1">Informe a altura das barras:</label>
        <input type="text" name="b1" id="b1" value="0" required/>
        <input type="text" name="b2" id="b2" value="0" required/>
        <input type="text" name="b3" id="b3" value="0" required/>
        <input type="text" name="b4" id="b4" value="0" required/>
        <input type="text" name="b5" id="b5" value="0" /><br>
        <label for="l">Informe a largura das barras:</label>
        <input type="text" name="l" id="l" value="0" required/><br>
        <button id="ok">Desenhar o Gráfico</button><br>
        
</form>
<div class="grafico" id="g"></div>
<script type="text/javascript" src="script.js"></script>
</body>
