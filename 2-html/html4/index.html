<!DOCTYPE html>
<head>
    <meta charset="UTF8">
    <meta name="author" content="Rafael Catilho">
    <title>Instituto de Computação</title>
</head>
<body>
    <h1>Formulário de Contato</h1>
    <form id="form" method="POST" action="processa.js">
    <fieldset>
        <legend>Dados Básicos</legend>
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome"  required/><br>
        <label for="email">E-mail</label>
        <input type="text" name="email" id="email" \
        placeholder="seunome@dominio.com.br" required/><br>
        <label for="site">Website</label>
        <input type="text" name="site" id="site" value="https://"required/>
    </fieldset> 
    <fieldset>
        <legend>Seu curso no Instituto de Computação</legend>
        <input type="radio" name="curso" value="cc" id="cc" />
        <label for="cc">Ciência da Computação</label><br>
        <input type="radio" name="curso" value="si" id="si" />
        <label for="si">Sistemas de Informação</label><br>
        <input type="radio" name="curso" value="ec" id="ec" />
        <label for="ec">Engenharia da Computação</label><br>
    </fieldset> 
    <fieldset>
        <legend>Assinale as Linguagens já usadas por você:</legend>
        <label for="java">Java</label>
        <input type="checkbox" name="lang" value="java" id="java" />
        <label for="c">C</label>
        <input type="checkbox" name="lang" value="c" id="c" />
        <label for="cpp">C++</label>
        <input type="checkbox" name="lang" value="cpp" id="cpp" />
        <label for="pearl">Pearl</label>
        <input type="checkbox" name="lang" value="pearl" id="pearl" />
        <label for="python">Python</label>
        <input type="checkbox" name="lang" value="python" id="python" />
        <label for="javascript">Javascript</label>
        <input type="checkbox" name="lang" value="javascript" id="javascript" />
    </fieldset> 
    <fieldset>
        <legend>Dados Complementares</legend>
        <label for="cor">Cor favoita</label>
        <input type="color" name="cor" id="cor"><br>
        <label for="nascimento">Data de nascimento</label>
        <input type="date" name="nascimento" id="nascimento"><br>
        <label for="ano">Ano de entrada em seu curso</label>
        <input type="number" name="ano" id="ano" min="1980" \
        max="2020" step="1" value="2020"><br>
        <label for="nota">Nota para esse site</label>
        <input type="range" name="nota" id="nota"><br>
    </fieldset> 
    <fieldset>
        <legend>Área de atuação</legend>
        <select name="area" id="area">
            <option value="1">Banco de Dados</option>
            <option value="2">Educação a Distância</option>
            <option value="3">Engenharia de Software</option>
            <option value="4">Otimização</option>
            <option value="5">Programação para a Web</option>
            <option value="6">Recuperação de Informação</option>
            <option value="7">Redes de Computadores</option>
        </select>
    </fieldset> 
    <fieldset>
        <legend>Submeta seu curriculo vitae</legend>
        <input type="file" name="curriculo" id="curriculo"/>
    </fieldset> 
    <fieldset>
        <legend>Escreva sua mensagem</legend>
        <textarea name="mensagem" id="mensagem">Este é o valor padrão!
        </textarea>   
    </fieldset>
    <input type="reset" value="Resetar Dados"/>
    <input type="submit" value="Enviar Mensagem" />
</form> 
    
</body>
