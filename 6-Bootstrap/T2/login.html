<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loja WA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
  <main class="m-0 p-0 container">
    <div class="row min-vw-100 min-vh-100">

      <div class="col col-12 col-md-5 bg-light d-flex justify-content-center align-items-center ">
        <h1>Bem vindo à Loja WA!</h1>
      </div>


      <div class=" col col-12 col-md-7 d-flex justify-content-center align-items-center ">
        <div>
          <form class="g-3 needs-validation" validate>

            <div class="d-block">
              <label for="emailUsuario" class="form-label">Email</label>
              <input type="email" class="form-control" id="emailUsuario" value="" required>
              <div class="invalid-feedback">
                Preencha este campo.
              </div>
            </div>


            <div class="d-block">
              <label for="senhaUsuario" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senhaUsuario" value="" required>
              <div class="invalid-feedback">
                Preencha este campo.
              </div>
            </div>

            <div class="d-block mt-3">
              <button type="submit" class="btn btn-success w-100">Entrar</button>
            </div>
            <div class="d-flex justify-content-center mt-3">
              <a href="cadastro.html">
                Não tenho cadastro.
              </a>
            </div>

          </form>
        </div>

      </div>

    </div>
  </main>
</body>

</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
