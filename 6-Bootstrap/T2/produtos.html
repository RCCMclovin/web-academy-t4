<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loja WA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>


<body>
  <nav class="navbar navbar-expand-lg bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Loja WA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">Início</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="produtos.html">Gerenciar Produtos</a>
          </li>

        </ul>
        <a href="login.html">
          <button type="button" class="btn btn-primary">login</button>
        </a>

      </div>
    </div>
  </nav>

  <h1>Gerenciar Produtos:</h1>
  <div class="d-flex justify-content-end">
    <button type="button" class="btn btn-warning mx-md-2" data-bs-toggle="modal" data-bs-target="#exampleModal">
      Novo Produto
    </button>
  </div>

  <table class="table caption-top">
    <caption></caption>


    <thead>
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Produto</th>
        <th scope="col">Preço</th>
        <th scope="col">Estoque</th>
        <th scope="col">Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr class="table-secondary">
        <th scope="row">1</th>
        <td>Produto 1</td>
        <td>R$ 200,00</td>
        <td>5</td>
        <td><button class="btn btn-secondary">Editar</button> <button class="btn btn-secondary">Remover</button></td>
      </tr>
      <tr>
        <th scope="row">2</th>
        <td>Produto 2</td>
        <td>R$ 500,00</td>
        <td>50</td>
        <td><button class="btn btn-secondary">Editar</button> <button class="btn btn-secondary">Remover</button></td>
      </tr>
      <tr class="table-secondary">
        <th scope="row">3</th>
        <td>Produto 3</td>
        <td>R$ 1200,00</td>
        <td>10</td>
        <td><button class="btn btn-secondary">Editar</button> <button class="btn btn-secondary">Remover</button></td>
      </tr>
      <tr>
        <th scope="row">4</th>
        <td>Produto 4</td>
        <td>R$ 600,00</td>
        <td class="text-danger">0</td>
        <td><button class="btn btn-secondary">Editar</button> <button class="btn btn-secondary">Remover</button></td>
      </tr>
    </tbody>
  </table>

  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Novo Produto</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <form class="g-3 needs-validation" validate>

            <div class="d-block">
              <label for="nomeProduto" class="form-label">Nome do Produto</label>
              <input type="text" class="form-control" id="nomeProduto" value="" required>
              <div class="invalid-feedback">
                Preencha este campo.
              </div>
            </div>

            <div class="d-block">
              <label for="precoProduto" class="form-label">Preço do Produto</label>
              <input type="number" class="form-control" id="precoProduto" value="1000.00" required>
              <div class="invalid-feedback">
                Preencha este campo.
              </div>
            </div>

            <div class="d-block">
              <label for="estoqueProduto" class="form-label">Estoque do Produto</label>
              <input type="number" class="form-control" id="estoqueProduto" value="0" required>
              <div class="invalid-feedback">
                Preencha este campo.
              </div>
            </div>

            <div class="d-block mt-3">
              <button type="submit" class="btn btn-success w-100">Cadastrar Produto</button>
            </div>

          </form>
        </div>

      </div>
    </div>
  </div>

</body>

</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
