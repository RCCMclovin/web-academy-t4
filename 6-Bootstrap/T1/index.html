<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loja WA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Loja WA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon">
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Início</a>
          </li>

          <li class="nav-item">
            <a class="nav-link disabled">Gerenciar Produtos</a>
          </li>

        </ul>
        <button type="button" class="btn btn-primary">login</button>
      </div>
    </div>
  </nav>

  <h1>Produtos:</h1>

  <main class="container overflow-hidden text-center justify-content-between">
    <div class="row row-cols-md-4 row-cols-sm-2 row-cols-1 gy-5">

      <div class="col">
        <div class="card p-3">
          <img class="card-img-top" src="assets/placeholder-image.png" alt="Produto 1">
          <div class="card-body">
            <h2>Produto 1</h2>
            <p>R$ 200,00</p>
            <button type="button" class="btn btn-primary">Comprar</button>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card p-3">
          <img class="card-img-top" src="assets/placeholder-image.png" alt="Produto 2">
          <div class="card-body">
            <h2>Produto 2</h2>
            <p>R$ 500,00</p>
            <button type="button" class="btn btn-primary" href="#">Comprar</button>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card p-3">
          <img class="card-img-top" src="assets/placeholder-image.png" alt="Produto 3">
          <div class="card-body">
            <h2>Produto 3</h2>
            <p>R$ 1200,00</p>
            <button type="button" class="btn btn-primary" href="#">Comprar</button>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card p-3">
          <img class="card-img-top" src="assets/placeholder-image.png" alt="Produto 3">
          <div class="card-body">
            <h2>Produto 4</h2>
            <p>R$ 600,00</p>
            <button type="button" class="btn btn-secondary" disabled href="#">Comprar</button>
          </div>
        </div>
      </div>

    </div>
  </main>
</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
