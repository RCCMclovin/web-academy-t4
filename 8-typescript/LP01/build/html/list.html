<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <nav class="navbar navbar-expand-md bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="list.html">ToDo List</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="list.html">Início</a>
                    </li>

                </ul>
                <a href="index.html">
                    <button type="button" class="btn btn-primary">logout</button>
                </a>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="d-block">
            <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-warning mr-5" data-bs-toggle="modal" data-bs-target="#createModal">
                    Nova Tarefa
                </button>
            </div>
        </div>
        <div id="cards" class="d-flex justify-content-evenly align-items-center mt-5 flex-wrap"></div>
    </main>


    <!-- Modal -->
    <div class="modal fade" id="createModal" tabindex="-1" aria-labelledby="createModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="createModalLabel">Nova Tarefa</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="createForm" class="g-3 needs-validation" validate>

                        <div class="d-block">
                            <label for="nomeTarafa" class="form-label">Nome da tarefa</label>
                            <input type="text" class="form-control" id="nomeTarafa" value="" required>
                            <div class="invalid-feedback">
                                Preencha este campo.
                            </div>
                        </div>

                        <div class="d-block">
                            <label for="tempoTarafa" class="form-label">Prazo da tarefa</label>
                            <input type="text" class="form-control" id="tempoTarafa"
                                value="Tue Sep 17 2024 02:00:00 GMT-0400">
                        </div>

                        <div class="d-block">
                            <label for="descriçãoTarafa" class="form-label">Descrição da tarefa</label>
                            <input type="text" class="form-control" id="descriçãoTarafa" value="">
                        </div>

                        <div class="d-block mt-3">
                            <button type="submit" class="btn btn-success w-100">Cadastrar Tarefa</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal 2 -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="editModalLabel">Editar Tarefa</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="editForm" class="g-3 needs-validation" validate>

                        <div class="d-block">
                            <label for="EditNomeTarafa" class="form-label">Nome da tarefa</label>
                            <input type="text" class="form-control" id="EditNomeTarafa" value="" required>
                            <div class="invalid-feedback">
                                Preencha este campo.
                            </div>
                        </div>

                        <div class="d-block">
                            <label for="EditTempoTarafa" class="form-label">Prazo da tarefa</label>
                            <input type="text" class="form-control" id="EditTempoTarafa" value="">
                        </div>

                        <div class="d-block">
                            <label for="EditDescriçãoTarafa" class="form-label">Descrição da tarefa</label>
                            <input type="text" class="form-control" id="EditDescriçãoTarafa" value="">
                        </div>

                        <div class="d-block mt-3">
                            <button type="submit" class="btn btn-success w-100">Atualizar Tarefa</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
<script src="../js/index.js" type="text/javascript"></script>

</html>
