<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas de Turma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-md bg-light">
        <div class="container-fluid">
            <a class="navbar-brand return" href="index.html">Turmas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"> 
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link active return" aria-current="page" href="index.html">Início</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <main class="container min-vw-100">
        <div class="d-flex justify-content-center align-items-center">
            <table class="table caption-top">
            <caption></caption>
            <thead>
                <tr id="theadTurma">
                </tr>
            </thead>
            <tbody id="tbodyTurma">
            </tbody>
        </table>
        </div>
        <div class="d-block mt-2">
            <div class="d-flex justify-content-end">
                <button id="createBut" type="button" class="btn btn-warning mr-5" data-bs-toggle="modal"
                    data-bs-target="#createTurmaModal">
                    Criar Turma
                </button>
            </div>
        </div>
        <table class="table caption-top">
            <caption></caption>
            <thead>
                <tr id="thead">
                </tr>
            </thead>
            <tbody id="tbody">
            </tbody>
        </table>

    </main>

    <!-- Modal -->
    <div class="modal fade" id="createTurmaModal" tabindex="-1" aria-labelledby="createTurmaModal" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="createTurmaModal">Nova Turma</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="formCreateTurma" class="g-3 needs-validation" validate>

                        <div class="d-block">
                            <label for="nomeTurma" class="form-label">Nome da Turma</label>
                            <input type="text" class="form-control" id="nomeTurma" value="" required>
                            <div class="invalid-feedback">
                                Preencha este campo.
                            </div>
                        </div>

                        <div class="d-block mt-3">
                            <button type="submit" class="btn btn-success w-100">Cadastrar Turma</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal 2-->
    <div class="modal fade" id="createAlunoModal" tabindex="-1" aria-labelledby="createAlunoModal" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="createAlunoModal">Novo Aluno</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <button id="createRandom" type="button" class="btn-warning w-100">Gerar Aleatório</button>
                    <form id="formCreateAluno" class="g-3 needs-validation" validate>

                        <div class="d-block">
                            <label for="nomeAluno" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="nomeAluno" value="" required>
                            <div class="invalid-feedback">
                                Preencha este campo.
                            </div>
                        </div>

                        <div class="d-block">
                            <label for="idadeAluno" class="form-label">Idade</label>
                            <input type="number" class="form-control" id="idadeAluno" value="" required>
                            <div class="invalid-feedback">
                                Preencha este campo.
                            </div>
                        </div>

                        <div class="d-block">
                            <label for="alturaAluno" class="form-label">Altura</label>
                            <input type="number" class="form-control" id="alturaAluno" value="" required>
                            <div class="invalid-feedback">
                                Preencha este campo.
                            </div>
                        </div>

                        <div class="d-block">
                            <label for="pesoAluno" class="form-label">Peso</label>
                            <input type="number" class="form-control" id="pesoAluno" value="" required>
                            <div class="invalid-feedback">
                                Preencha este campo.
                            </div>
                        </div>

                        <div class="d-block mt-3">
                            <button type="submit" class="btn btn-success w-100">Cadastrar Aluno</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal 3-->
    <div class="modal fade" id="editAlunoModal" tabindex="-1" aria-labelledby="editAlunoModal" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="editAlunoModal">Editar Aluno</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <button id="editRandom" type="button" class="btn-warning w-100">Gerar Aleatório</button>
                    <form id="formEditAluno" class="g-3 needs-validation" validate>

                        <div class="d-block">
                            <label for="nomeAlunoEdit" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="nomeAlunoEdit" value="" required>
                            <div class="invalid-feedback">
                                Preencha este campo.
                            </div>
                        </div>

                        <div class="d-block">
                            <label for="idadeAlunoEdit" class="form-label">Idade</label>
                            <input type="number" class="form-control" id="idadeAlunoEdit" value="" required>
                            <div class="invalid-feedback">
                                Preencha este campo.
                            </div>
                        </div>

                        <div class="d-block">
                            <label for="alturaAlunoEdit" class="form-label">Altura</label>
                            <input type="number" class="form-control" id="alturaAlunoEdit" value="" required>
                            <div class="invalid-feedback">
                                Preencha este campo.
                            </div>
                        </div>

                        <div class="d-block">
                            <label for="pesoAlunoEdit" class="form-label">Peso</label>
                            <input type="number" class="form-control" id="pesoAlunoEdit" value="" required>
                            <div class="invalid-feedback">
                                Preencha este campo.
                            </div>
                        </div>

                        <div class="d-block mt-3">
                            <button type="submit" class="btn btn-success w-100">Editar Aluno</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>


</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
<script src="../js/index.js" type="text/javascript"></script>

</html>
